[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-compat"
version = "0.1.0"
description = "Open framework for simulating compatibility between agents — twin pairing, stress scenarios, no single match score"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Daniel Strader (chaoz23)", email = "chaoz23@gmail.com" }]
keywords = ["agents", "digital-twin", "compatibility", "simulation", "multi-agent", "matching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/chaoz23/agent-compat"
Specification = "https://github.com/chaoz23/agent-compat/tree/main/spec"

[project.scripts]
agent-compat = "agent_compat.run:main"

[tool.setuptools]
package-dir = { agent_compat = "runner" }
packages = ["agent_compat"]

[tool.setuptools.package-data]
agent_compat = ["data/*.md"]
